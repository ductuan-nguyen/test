<title>Vòng Quay May Mắn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Paytone+One&display=swap">
<style>
  /* Single deliberate look: red lacquer + gold, like a Tết lucky draw. */
  :root {
    color-scheme: dark;
    --lacquer: #6e0b12;
    --lacquer-deep: #3f0508;
    --crimson: #c8102e;
    --gold: #f2c14e;
    --gold-deep: #b8861b;
    --cream: #fff4dc;
    --ink: #3a0a0c;
    --display: "Paytone One", "Arial Black", system-ui, sans-serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 50% 38%, #9a1420 0%, var(--lacquer) 45%, var(--lacquer-deep) 100%);
    background-color: var(--lacquer);
    color: var(--cream);
    font-family: var(--body);
    margin: 0;
    padding-inline: 16px;
    padding-block: clamp(14px, 4svh, 32px);
    box-sizing: border-box;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.6svh, 22px);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  header { text-align: center; display: grid; gap: 6px; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(30px, 8vw, 48px);
    line-height: 1.05;
    color: var(--gold);
    text-shadow: 0 3px 0 var(--lacquer-deep), 0 0 24px rgba(242, 193, 78, .35);
    text-wrap: balance;
  }
  .sub {
    margin: 0;
    font-size: 14px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--cream) 75%, transparent);
  }

  /* Wheel fits both the width and the height of the screen (phones, landscape). */
  .stage {
    position: relative;
    container-type: inline-size;
    width: max(220px, min(calc(100vw - 32px), 460px, calc(100svh - 250px)));
    max-width: 100%;
    aspect-ratio: 1;
    margin-top: 2.5%;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #wheel {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow: 0 4cqw 9cqw rgba(0, 0, 0, .45), 0 0 0 1.3cqw var(--gold-deep);
    will-change: transform;
    touch-action: manipulation;
  }
  .pointer {
    position: absolute;
    left: 50%;
    top: -3cqw;
    width: 9.5cqw;
    height: 12.6cqw;
    transform: translateX(-50%);
    transform-origin: 50% 20%;
    z-index: 2;
    filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .45));
    transition: transform .08s ease-out;
  }
  .pointer.tick { transform: translateX(-50%) rotate(-14deg); transition: none; }

  #spin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 26%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    padding: 0;
    border: max(3px, 1.1cqw) solid var(--cream);
    background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 45%, var(--gold-deep));
    color: var(--ink);
    font-family: var(--display);
    font-size: 6cqw;
    letter-spacing: .04em;
    cursor: pointer;
    box-shadow: 0 1.3cqw 0 var(--gold-deep), 0 2.2cqw 5cqw rgba(0, 0, 0, .45);
    z-index: 3;
    touch-action: manipulation;
    transition: transform .12s, box-shadow .12s, filter .2s;
  }
  #spin:hover:not(:disabled) { filter: brightness(1.06); }
  #spin:active:not(:disabled) {
    transform: translate(-50%, calc(-50% + 1cqw));
    box-shadow: 0 .4cqw 0 var(--gold-deep), 0 1.3cqw 3cqw rgba(0, 0, 0, .45);
  }
  #spin:focus-visible { outline: 4px solid var(--cream); outline-offset: 4px; }
  #spin:disabled { cursor: default; filter: saturate(.7) brightness(.92); }

  .result {
    min-height: 76px;
    display: grid;
    place-items: center;
    text-align: center;
    gap: 2px;
  }
  .result .label {
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--cream) 70%, transparent);
  }
  .result .value {
    font-family: var(--display);
    font-size: 44px;
    line-height: 1;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .result .hint { font-size: 15px; color: var(--cream); }
  .result.pop .value { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .count {
    font-size: 13px;
    color: color-mix(in srgb, var(--cream) 60%, transparent);
    font-variant-numeric: tabular-nums;
  }

  /* Small or short phones: tighten the header and result so the wheel stays big. */
  @media (max-width: 420px), (max-height: 700px) {
    h1 { font-size: clamp(26px, 7.5vw, 34px); }
    .sub { font-size: 12px; letter-spacing: .1em; }
    .result { min-height: 64px; }
    .result .value { font-size: 38px; }
    .result .hint { font-size: 14px; }
  }
  /* Phone held sideways: drop the subtitle and size the wheel by height. */
  @media (max-height: 480px) and (orientation: landscape) {
    .sub { display: none; }
    h1 { font-size: 24px; }
    .stage { width: max(200px, calc(100svh - 150px)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .result.pop .value { animation: none; }
    .pointer, .pointer.tick { transition: none; transform: translateX(-50%); }
  }
</style>

<header>
  <h1>Vòng Quay May Mắn</h1>
  <p class="sub">10 ô số · bấm quay để thử vận may</p>
</header>

<div class="stage">
  <svg class="pointer" id="pointer" viewBox="0 0 44 58" aria-hidden="true">
    <path d="M22 56 L4 16 A18 18 0 1 1 40 16 Z" fill="#fff4dc" stroke="#b8861b" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="22" cy="17" r="7" fill="#c8102e"/>
  </svg>
  <canvas id="wheel" width="1000" height="1000" role="img" aria-label="Vòng quay gồm các số từ 1 đến 10"></canvas>
  <button id="spin" type="button">QUAY</button>
</div>

<div class="result" id="result" aria-live="polite">
  <span class="hint">Bấm <strong>QUAY</strong> ở giữa vòng</span>
</div>
<div class="count" id="count"></div>

<script>
(() => {
  const N = 10;
  const SLICE = 360 / N;
  const WINNER = 10;                     // the number the wheel always stops on
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('spin');
  const pointer = document.getElementById('pointer');
  const resultEl = document.getElementById('result');
  const countEl = document.getElementById('count');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const fills = ['#c8102e', '#fff4dc', '#e8a317', '#8e0c1d', '#fff4dc'];
  const inks  = ['#fff4dc', '#8e0c1d', '#3a0a0c', '#f2c14e', '#c8102e'];

  function drawWheel() {
    const S = canvas.width, c = S / 2, r = c - 8;
    ctx.clearRect(0, 0, S, S);

    // outer gold rim
    ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2);
    ctx.fillStyle = '#b8861b'; ctx.fill();

    const inner = r - 46;
    for (let i = 0; i < N; i++) {
      // slice i holds number i+1, measured clockwise from 12 o'clock
      const a0 = (i * SLICE - 90) * Math.PI / 180;
      const a1 = ((i + 1) * SLICE - 90) * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, inner, a0, a1); ctx.closePath();
      ctx.fillStyle = fills[i % fills.length]; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = '#b8861b'; ctx.stroke();

      const mid = (a0 + a1) / 2;
      ctx.save();
      ctx.translate(c, c); ctx.rotate(mid + Math.PI / 2);
      ctx.fillStyle = inks[i % inks.length];
      ctx.font = '400 104px "Paytone One", "Arial Black", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), 0, -inner * 0.72);
      ctx.restore();
    }

    // bulbs on the rim, one on each slice edge and one mid-slice
    for (let k = 0; k < N * 2; k++) {
      const a = (k * SLICE / 2 - 90) * Math.PI / 180;
      const x = c + Math.cos(a) * (r - 23), y = c + Math.sin(a) * (r - 23);
      ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2);
      ctx.fillStyle = k % 2 ? '#fff4dc' : '#ffe08a'; ctx.fill();
    }

    // hub ring behind the button
    ctx.beginPath(); ctx.arc(c, c, S * 0.16, 0, Math.PI * 2);
    ctx.fillStyle = '#6e0b12'; ctx.fill();
  }

  let rotation = 0;      // current wheel rotation in degrees (clockwise)
  let spins = 0;

  const norm = d => ((d % 360) + 360) % 360;
  // Which number sits under the top pointer for a given rotation
  const numberAt = rot => Math.floor(norm(-rot) / SLICE) + 1;
  const easeOut = t => 1 - Math.pow(1 - t, 4);

  function spin() {
    btn.disabled = true;
    resultEl.classList.remove('pop');
    resultEl.innerHTML = '<span class="hint">Đang quay…</span>';

    // Stop somewhere inside slice 10, not always dead-centre
    const centre = (WINNER - 1) * SLICE + SLICE / 2;
    const offset = (Math.random() * 2 - 1) * (SLICE / 2 - 4);
    const stopAt = norm(-(centre + offset));
    const turns = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 4);
    const start = rotation;
    const target = start + turns * 360 + norm(stopAt - norm(start));
    const duration = reduceMotion ? 1200 : 4800 + Math.random() * 1200;

    let t0 = null;
    let lastSlice = Math.floor((start + SLICE / 2) / (SLICE / 2));
    function frame(now) {
      if (t0 === null) t0 = now;
      const t = Math.min(1, (now - t0) / duration);
      rotation = start + (target - start) * easeOut(t);
      canvas.style.transform = `rotate(${rotation}deg)`;

      // flick the pointer each time a bulb/peg passes
      const s = Math.floor((rotation + SLICE / 2) / (SLICE / 2));
      if (s !== lastSlice && !reduceMotion) {
        lastSlice = s;
        pointer.classList.add('tick');
        requestAnimationFrame(() => pointer.classList.remove('tick'));
      }

      if (t < 1) requestAnimationFrame(frame);
      else done();
    }
    requestAnimationFrame(frame);
  }

  function done() {
    rotation = norm(rotation);
    canvas.style.transform = `rotate(${rotation}deg)`;
    const n = numberAt(rotation);
    spins++;
    resultEl.innerHTML = `<span class="label">Kết quả</span><span class="value">${n}</span>`;
    void resultEl.offsetWidth;
    resultEl.classList.add('pop');
    countEl.textContent = `Đã quay ${spins} lượt`;
    btn.disabled = false;
    btn.focus({ preventScroll: true });
  }

  btn.addEventListener('click', spin);

  drawWheel();
  // redraw once the display font is ready so the numbers use it
  if (document.fonts && document.fonts.load) {
    document.fonts.load('104px "Paytone One"').then(drawWheel).catch(() => {});
  }
})();
</script>
