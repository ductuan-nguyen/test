<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6e0b12">
<title>Vòng Quay May Mắn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Paytone+One&display=swap">
<style>
  /* Red lacquer + gold, like a Tết lucky draw. */
  :root {
    color-scheme: dark;
    --lacquer: #6e0b12;
    --lacquer-deep: #3f0508;
    --gold: #f2c14e;
    --gold-deep: #b8861b;
    --cream: #fff4dc;
    --cream-dim: rgba(255, 244, 220, .72);
    --ink: #3a0a0c;
    --panel: rgba(63, 5, 8, .55);
    --display: "Paytone One", "Arial Black", system-ui, sans-serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --u: 3.6px;                /* 1% of the wheel width, kept in sync by JS */
  }
  * { box-sizing: border-box; }
  html { background: var(--lacquer-deep); overflow-x: hidden; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at 50% 42%, #a0151f 0%, var(--lacquer) 48%, var(--lacquer-deep) 100%) fixed;
    background-color: var(--lacquer);
    color: var(--cream);
    font-family: var(--body);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  main {
    /* margin:auto centres vertically without clipping the top on short screens */
    margin: auto;
    width: 100%;
    max-width: 500px;
    padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  header { text-align: center; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 30px;
    font-size: clamp(28px, 8.4vw, 44px);
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 3px 0 var(--lacquer-deep), 0 0 22px rgba(242, 193, 78, .3);
  }
  .sub { margin: 6px 0 0; font-size: 14px; color: var(--cream-dim); }

  /* ---------- wheel ---------- */
  .stage {
    position: relative;
    width: 88vw;                                             /* old browsers */
    width: min(calc(100vw - 28px), 460px);
    width: max(240px, min(calc(100vw - 28px), 460px, calc(100svh - 300px)));
    max-width: 100%;
    margin-top: calc(var(--u) * 2);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .stage::before { content: ""; display: block; padding-top: 100%; } /* square without aspect-ratio */
  /* Round clip around the canvas: a rotating square's bounding box grows up to 1.41x,
     which otherwise widens the page on phones and makes the browser zoom out. */
  .wheel-clip {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    -webkit-mask-image: -webkit-radial-gradient(white, black);   /* makes Safari clip the rounded corners */
    mask-image: radial-gradient(white, black);
    box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 8) rgba(0, 0, 0, .5), 0 0 0 calc(var(--u) * 1.2) var(--gold-deep);
  }
  #wheel {
    width: 100%;
    height: 100%;
    display: block;
    will-change: transform;
  }
  .pointer {
    position: absolute;
    left: 50%;
    top: -3.2%;
    width: 10%;
    height: 13.2%;
    margin-left: -5%;
    transform-origin: 50% 25%;
    z-index: 2;
    filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .45));
    transition: transform .09s ease-out;
  }
  .pointer.tick { transform: rotate(-16deg); transition: none; }

  #spin {
    position: absolute;
    left: 37%;
    top: 37%;
    width: 26%;
    height: 26%;
    border-radius: 50%;
    padding: 0;
    border: calc(var(--u) * 1.1) solid var(--cream);
    background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 45%, var(--gold-deep));
    color: var(--ink);
    font-family: var(--display);
    font-size: calc(var(--u) * 5.8);
    letter-spacing: .03em;
    cursor: pointer;
    box-shadow: 0 calc(var(--u) * 1.2) 0 var(--gold-deep), 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(0, 0, 0, .45);
    z-index: 3;
    touch-action: manipulation;
    transition: transform .12s, box-shadow .12s, filter .2s;
  }
  #spin:active:not(:disabled) {
    transform: translateY(calc(var(--u) * 1));
    box-shadow: 0 calc(var(--u) * .3) 0 var(--gold-deep), 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0, 0, 0, .45);
  }
  #spin:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }
  #spin:disabled { cursor: default; filter: saturate(.75) brightness(.9); }

  /* ---------- result panel ---------- */
  .panel {
    width: 100%;
    max-width: 460px;
    padding: 14px 16px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid rgba(242, 193, 78, .28);
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 6px 16px;
  }
  .res {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--gold);
    color: var(--ink);
    font-family: var(--display);
    font-size: 36px;
    line-height: 1;
    box-shadow: inset 0 -4px 0 var(--gold-deep);
    font-variant-numeric: tabular-nums;
  }
  .res.idle { background: rgba(255, 244, 220, .1); color: var(--cream-dim); box-shadow: none; font-size: 28px; }
  .res.pop { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
  .msg { display: grid; gap: 4px; min-width: 0; }
  .msg .label {
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--cream-dim);
  }
  .msg .text { font-size: 17px; font-weight: 600; line-height: 1.3; }
  .history {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-top: 10px;
    border-top: 1px solid rgba(242, 193, 78, .18);
    font-size: 13px;
    color: var(--cream-dim);
    font-variant-numeric: tabular-nums;
  }
  .history:empty { display: none; }
  .chip {
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255, 244, 220, .08);
    border: 1px solid rgba(255, 244, 220, .14);
    white-space: nowrap;
  }
  .chip b { color: var(--gold); font-weight: 700; }

  /* short screens (small phones, in-app browsers with big toolbars) */
  @media (max-height: 700px) {
    main { gap: 12px; }
    h1 { font-size: clamp(24px, 7vw, 34px); }
    .sub { display: none; }
    .panel { padding: 10px 14px; }
    .res { width: 58px; height: 58px; font-size: 30px; }
    .res.idle { font-size: 24px; }
    .msg .text { font-size: 15px; }
  }
  /* phone held sideways: wheel on the left, text on the right */
  @media (max-height: 520px) and (orientation: landscape) {
    main {
      max-width: 820px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas: "stage header" "stage panel";
      align-content: center;
      align-items: center;
      column-gap: 28px;
    }
    header { grid-area: header; align-self: end; text-align: left; }
    .stage { grid-area: stage; width: max(200px, calc(100vh - 60px)); width: max(200px, calc(100svh - 60px)); }
    .panel { grid-area: panel; align-self: start; }
  }

  /* ---------- jackpot celebration ---------- */
  [hidden] { display: none !important; }
  .res.win { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1), glow 1.2s ease-in-out .5s 3; }
  @keyframes glow {
    50% { box-shadow: inset 0 -4px 0 var(--gold-deep), 0 0 0 6px rgba(242, 193, 78, .35), 0 0 28px 6px rgba(255, 224, 138, .7); }
  }
  .wheel-clip.win { animation: ringflash .35s steps(2) 6; }
  @keyframes ringflash {
    50% { box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 8) rgba(0, 0, 0, .5), 0 0 0 calc(var(--u) * 1.6) #ffe08a, 0 0 calc(var(--u) * 8) rgba(255, 224, 138, .8); }
  }
  #confetti {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
  }
  .congrats {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(30, 2, 4, .6);
    animation: fade .25s ease-out;
  }
  @keyframes fade { from { opacity: 0; } }
  .congrats .card {
    width: 100%;
    max-width: 340px;
    padding: 26px 22px 22px;
    border-radius: 24px;
    text-align: center;
    background: radial-gradient(circle at 50% 0%, #b3182a, var(--lacquer) 70%);
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 6px rgba(242, 193, 78, .18), 0 24px 60px rgba(0, 0, 0, .55);
    display: grid;
    justify-items: center;
    gap: 8px;
    animation: pop .55s cubic-bezier(.2, 1.6, .4, 1);
  }
  .congrats .big {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 45%, var(--gold-deep));
    color: var(--ink);
    font-family: var(--display);
    font-size: 52px;
    line-height: 1;
    border: 4px solid var(--cream);
    box-shadow: 0 6px 0 var(--gold-deep);
    margin-bottom: 6px;
  }
  .congrats h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 32px;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 3px 0 var(--lacquer-deep);
  }
  .congrats p { margin: 0; font-size: 16px; color: var(--cream); }
  .congrats button {
    margin-top: 12px;
    padding: 12px 28px;
    border: 0;
    border-radius: 999px;
    background: var(--gold);
    color: var(--ink);
    font: 700 16px var(--body);
    box-shadow: 0 4px 0 var(--gold-deep);
    cursor: pointer;
    touch-action: manipulation;
  }
  .congrats button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep); }
  .congrats button:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .res.pop, .res.win, .wheel-clip.win, .congrats, .congrats .card { animation: none; }
    .pointer, .pointer.tick { transition: none; transform: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Vòng Quay May Mắn</h1>
    <p class="sub">Bấm QUAY để thử vận may</p>
  </header>

  <div class="stage" id="stage">
    <svg class="pointer" id="pointer" viewBox="0 0 44 58" aria-hidden="true">
      <path d="M22 56 L4 16 A18 18 0 1 1 40 16 Z" fill="#fff4dc" stroke="#b8861b" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="22" cy="17" r="7" fill="#c8102e"/>
    </svg>
    <div class="wheel-clip">
      <canvas id="wheel" width="1000" height="1000" role="img" aria-label="Vòng quay gồm các số từ 1 đến 10"></canvas>
    </div>
    <button id="spin" type="button">QUAY</button>
  </div>

  <section class="panel" aria-live="polite">
    <div class="res idle" id="res">?</div>
    <div class="msg">
      <span class="label" id="label">Sẵn sàng</span>
      <span class="text" id="text">Bấm nút QUAY ở giữa vòng</span>
    </div>
    <div class="history" id="history"></div>
  </section>
</main>

<div class="congrats" id="congrats" role="dialog" aria-modal="true" aria-labelledby="congrats-title" hidden>
  <div class="card">
    <div class="big">10</div>
    <h2 id="congrats-title">Chúc mừng!</h2>
    <p>Bạn đã quay trúng số 10</p>
    <button type="button" id="congrats-close">Quay tiếp</button>
  </div>
</div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
  const N = 10;
  const SLICE = 360 / N;
  // Spin number -> forced result. Every spin not listed here is random.
  const FORCED = { 3: 10 };
  const JACKPOT = 10;           // landing on this number triggers the celebration

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('spin');
  const pointer = document.getElementById('pointer');
  const resEl = document.getElementById('res');
  const labelEl = document.getElementById('label');
  const textEl = document.getElementById('text');
  const historyEl = document.getElementById('history');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Keep --u = 1% of the wheel width so the button and shadows scale with it
  function syncUnit() {
    const w = stage.getBoundingClientRect().width;
    if (w) document.documentElement.style.setProperty('--u', (w / 100) + 'px');
  }
  syncUnit();
  if (window.ResizeObserver) new ResizeObserver(syncUnit).observe(stage);
  else window.addEventListener('resize', syncUnit);

  const fills = ['#c8102e', '#fff4dc', '#e8a317', '#8e0c1d', '#fff4dc'];
  const inks  = ['#fff4dc', '#8e0c1d', '#3a0a0c', '#f2c14e', '#c8102e'];

  function drawWheel() {
    const S = canvas.width, c = S / 2, r = c - 8;
    ctx.clearRect(0, 0, S, S);

    ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2);
    ctx.fillStyle = '#b8861b'; ctx.fill();

    const inner = r - 46;
    for (let i = 0; i < N; i++) {
      // slice i holds number i+1, measured clockwise from 12 o'clock
      const a0 = (i * SLICE - 90) * Math.PI / 180;
      const a1 = ((i + 1) * SLICE - 90) * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, inner, a0, a1); ctx.closePath();
      ctx.fillStyle = fills[i % fills.length]; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = '#b8861b'; ctx.stroke();

      const label = String(i + 1);
      ctx.save();
      ctx.translate(c, c); ctx.rotate((a0 + a1) / 2 + Math.PI / 2);
      ctx.fillStyle = inks[i % inks.length];
      ctx.font = '400 108px "Paytone One", "Arial Black", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const y = -inner * 0.72;
      ctx.fillText(label, 0, y);
      // underline 6 and 9 so they can't be mixed up when upside down
      if (label === '6' || label === '9') {
        const w = ctx.measureText(label).width;
        ctx.fillRect(-w / 2, y + 50, w, 10);
      }
      ctx.restore();
    }

    for (let k = 0; k < N * 2; k++) {
      const a = (k * SLICE / 2 - 90) * Math.PI / 180;
      const x = c + Math.cos(a) * (r - 23), y = c + Math.sin(a) * (r - 23);
      ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2);
      ctx.fillStyle = k % 2 ? '#fff4dc' : '#ffe08a'; ctx.fill();
    }

    ctx.beginPath(); ctx.arc(c, c, S * 0.16, 0, Math.PI * 2);
    ctx.fillStyle = '#6e0b12'; ctx.fill();
  }

  let rotation = 0;      // wheel rotation in degrees, clockwise
  let spins = 0;
  const history = [];

  const norm = d => ((d % 360) + 360) % 360;
  const numberAt = rot => Math.floor(norm(-rot) / SLICE) + 1;   // number under the pointer
  const easeOut = t => 1 - Math.pow(1 - t, 4);

  function spin() {
    btn.disabled = true;
    const turnNo = spins + 1;
    const winner = FORCED[turnNo] || 1 + Math.floor(Math.random() * N);

    resEl.className = 'res idle';
    resEl.textContent = '…';
    labelEl.textContent = 'Lượt ' + turnNo;
    textEl.textContent = 'Đang quay…';

    // stop somewhere inside the winning slice, not always dead-centre
    const centre = (winner - 1) * SLICE + SLICE / 2;
    const offset = (Math.random() * 2 - 1) * (SLICE / 2 - 4);
    const stopAt = norm(-(centre + offset));
    const turns = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 4);
    const start = rotation;
    const target = start + turns * 360 + norm(stopAt - norm(start));
    const duration = reduceMotion ? 1200 : 4800 + Math.random() * 1200;

    let t0 = null;
    let lastPeg = Math.floor((start + SLICE / 2) / (SLICE / 2));
    function frame(now) {
      if (t0 === null) t0 = now;
      const t = Math.min(1, (now - t0) / duration);
      rotation = start + (target - start) * easeOut(t);
      canvas.style.transform = 'rotate(' + rotation + 'deg)';

      const peg = Math.floor((rotation + SLICE / 2) / (SLICE / 2));
      if (peg !== lastPeg && !reduceMotion) {
        lastPeg = peg;
        pointer.classList.add('tick');
        requestAnimationFrame(() => pointer.classList.remove('tick'));
      }

      if (t < 1) requestAnimationFrame(frame);
      else done(turnNo);
    }
    requestAnimationFrame(frame);
  }

  function done(turnNo) {
    rotation = norm(rotation);
    canvas.style.transform = 'rotate(' + rotation + 'deg)';
    const n = numberAt(rotation);
    spins = turnNo;

    const win = n === JACKPOT;
    resEl.className = 'res';
    resEl.textContent = n;
    void resEl.offsetWidth;
    resEl.classList.add(win ? 'win' : 'pop');
    labelEl.textContent = 'Lượt ' + turnNo;
    textEl.textContent = win ? 'Chúc mừng! Bạn trúng số ' + n : 'Bạn quay được số ' + n;

    history.unshift(n);
    historyEl.innerHTML = history.slice(0, 8)
      .map((v, i) => '<span class="chip">Lượt ' + (turnNo - i) + ': <b>' + v + '</b></span>')
      .join('');

    if (navigator.vibrate) {
      try { navigator.vibrate(win ? [60, 40, 60, 40, 160] : 30); } catch (e) {}
    }
    btn.disabled = false;
    if (win) celebrate();
  }

  // ---------- jackpot celebration ----------
  const clip = stage.querySelector('.wheel-clip');
  const congrats = document.getElementById('congrats');
  const closeBtn = document.getElementById('congrats-close');
  const fx = document.getElementById('confetti');
  const fctx = fx.getContext('2d');
  let fxRun = 0;
  let closeTimer = null;

  function celebrate() {
    clip.classList.remove('win');
    void clip.offsetWidth;
    clip.classList.add('win');
    congrats.hidden = false;
    closeBtn.focus({ preventScroll: true });
    clearTimeout(closeTimer);
    closeTimer = setTimeout(closeCongrats, 6000);
    confetti();
  }

  function closeCongrats() {
    clearTimeout(closeTimer);
    if (congrats.hidden) return;
    congrats.hidden = true;
    btn.focus({ preventScroll: true });
  }
  closeBtn.addEventListener('click', closeCongrats);
  congrats.addEventListener('click', e => { if (e.target === congrats) closeCongrats(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCongrats(); });

  // two confetti cannons firing up from the bottom corners
  function confetti() {
    if (reduceMotion) return;
    const run = ++fxRun;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, H = window.innerHeight;
    fx.width = W * dpr; fx.height = H * dpr;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fx.hidden = false;

    const colors = ['#f2c14e', '#fff4dc', '#c8102e', '#e8a317', '#ffe08a', '#ff6b6b'];
    const k = Math.max(0.8, Math.min(1.6, H / 700));   // scale launch speed to the screen
    const parts = [];
    for (let i = 0; i < 180; i++) {
      const left = i % 2 === 0;
      parts.push({
        x: left ? -8 : W + 8,
        y: H * (0.7 + Math.random() * 0.25),
        vx: (left ? 1 : -1) * (2 + Math.random() * 7) * k * Math.max(0.7, W / 420),
        vy: -(9 + Math.random() * 10) * k,
        w: 6 + Math.random() * 6,
        h: 9 + Math.random() * 9,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.35,
        wob: Math.random() * Math.PI * 2,
        color: colors[i % colors.length],
        delay: Math.random() * 350,
      });
    }

    let t0 = null;
    function tick(now) {
      if (run !== fxRun) return;
      if (t0 === null) t0 = now;
      const el = now - t0;
      fctx.clearRect(0, 0, W, H);
      let alive = 0;
      for (const p of parts) {
        if (el < p.delay) { alive++; continue; }
        p.vy += 0.28 * k;
        p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy;
        p.rot += p.vr; p.wob += 0.12;
        if (p.y > H + 30) continue;
        alive++;
        fctx.save();
        fctx.translate(p.x, p.y);
        fctx.rotate(p.rot);
        fctx.scale(1, Math.cos(p.wob));             // paper flipping in the air
        fctx.fillStyle = p.color;
        fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        fctx.restore();
      }
      if (alive && el < 5000) requestAnimationFrame(tick);
      else { fctx.clearRect(0, 0, W, H); fx.hidden = true; }
    }
    requestAnimationFrame(tick);
  }

  btn.addEventListener('click', spin);

  drawWheel();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('108px "Paytone One"').then(drawWheel).catch(() => {});
  }
})();
</script>
</body>
</html>
